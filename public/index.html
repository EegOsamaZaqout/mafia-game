<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>مافيا — العبها مع صحابك أونلاين</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='18' y='6' width='64' height='88' rx='8' fill='%23A50E1F'/><text x='50' y='66' font-size='48' text-anchor='middle'>🔪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="strip" id="strip">
    <div class="brand">مافيا</div>
    <div class="strip-info" id="stripInfo"></div>
  </header>
  <div class="clock" id="clock"><i id="clockFill"></i></div>

  <div class="shell" id="shell">
    <main id="main"></main>

    <aside class="side hidden" id="side">
      <div id="voiceBar" class="voicebar hidden"></div>
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="chat" role="tab">الدردشة <span id="chatBadge" class="badge hidden">0</span></button>
        <button class="tab" data-tab="log" role="tab">السجل</button>
        <button class="tab" data-tab="roles" role="tab">الأدوار</button>
        <button class="tab close" id="sideClose" aria-label="سكّر">✕</button>
      </div>
      <section class="pane" id="pane-chat">
        <div id="chatTitle" class="chan"></div>
        <div id="chatMsgs"></div>
        <form id="chatForm" autocomplete="off">
          <input id="chatInput" maxlength="200" placeholder="اكتب رسالة">
          <button type="submit" class="btn">إرسال</button>
        </form>
      </section>
      <section class="pane hidden" id="pane-log"></section>
      <section class="pane hidden" id="pane-roles"></section>
    </aside>
  </div>

  <div class="dock hidden" id="dock"></div>
  <button class="side-toggle hidden" id="sideToggle" type="button" aria-label="افتح الدردشة والسجل">💬<span id="sideBadge" class="badge hidden">0</span></button>

  <div class="curtain" id="curtain" aria-hidden="true"><div class="curtain-title" id="curtainTitle"></div><div class="curtain-sub" id="curtainSub"></div></div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="conn" class="conn hidden">جاري إعادة الاتصال...</div>

  <script src="voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
